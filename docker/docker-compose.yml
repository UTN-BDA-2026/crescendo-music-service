name: crescensdo-music-service
services:
    postgresql:
        container_name: postgresql-servidor
        image: postgres:15.4-bullseye
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - ./sql:/docker-entrypoint-initdb.d
        restart: always
        labels:
            - "traefik.enable=true"
            - "traefik.tcp.routers.postgresql.rule=HostSNI(`*`)"
            - "traefik.tcp.routers.postgresql.entrypoints=postgresql"
            - "traefik.tcp.services.postgresql.loadbalancer.server.port=5432"

    mongodb:
        container_name: mongodb-servidor
        image: mongo:8.0.4
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
        volumes:
            - ./mongo-data:/data/db
        restart: always