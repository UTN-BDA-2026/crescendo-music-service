name: crescendo-music-service

services:
    postgresql:
        image: postgres:15.4-bullseye
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - ./sql:/docker-entrypoint-initdb.d
            - postgres-data:/var/lib/postgresql/data
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    mongodb:
        image: mongo:8.0.4
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-admin}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-admin123}
        volumes:
            - mongo-data:/data/db
            - mongo-config:/data/configdb
        restart: always
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "-u",
                    "${MONGODB_USER:-admin}",
                    "-p",
                    "${MONGODB_PASSWORD:-admin123}",
                    "--authenticationDatabase",
                    "admin",
                    "--eval",
                    "db.adminCommand('ping')"
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    crescendo-streaming:
        image: crescendo-streaming:1.0.0
        ports:
            - "8081:8081"
        environment:
            - ENV=CONTAINER
            - STREAMING_SERVICE_PORT=${STREAMING_SERVICE_PORT}
            - MONGODB_HOST=${MONGODB_HOST:-mongodb}
            - MONGODB_PORT=${MONGODB_PORT:-27017}
            - MONGODB_USER=${MONGODB_USER:-admin}
            - MONGODB_PASSWORD=${MONGODB_PASSWORD:-admin123}
            - JWT_SECRET=${JWT_SECRET}
        depends_on:
            mongodb:
                condition: service_healthy
        restart: always

    crescendo-api:
        image: crescendo-api:1.0.0
        ports:
            - "8080:8080"
        environment:
            - ENV=CONTAINER
            - POSTGRES_HOST=${POSTGRES_HOST:-postgresql}
            - POSTGRES_PORT=${POSTGRES_PORT:-5432}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - SQID_ALPHABET=${SQID_ALPHABET}
            - JWT_SECRET=${JWT_SECRET:-secret-key}
            - BASE_URL=${BASE_URL:-http://crescendo-streaming:${STREAMING_SERVICE_PORT:-8081}}
        depends_on:
            postgresql:
                condition: service_healthy 
        restart: always

    dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - dragonfly-data:/data
        ulimits:
            memlock: -1
        environment:
            - CACHE_PASSWORD=${CACHE_PASSWORD}
        command: dragonfly --requirepass ${CACHE_PASSWORD}

    seed:
        build: ./seed
        depends_on:
            postgresql:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        environment:
            - POSTGRES_HOST=${POSTGRES_HOST:-postgresql}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - MONGODB_HOST=${MONGODB_HOST:-mongodb}
            - MONGODB_PORT=${MONGODB_PORT:-27017}
            - MONGODB_USER=${MONGODB_USER:-admin}
            - MONGODB_PASSWORD=${MONGODB_PASSWORD:-admin123}
        restart: "no"
volumes:
    postgres-data:
    mongo-data:
    mongo-config:
    dragonfly-data: